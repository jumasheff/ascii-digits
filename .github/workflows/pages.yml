name: pages

# Publishes the site at https://jumasheff.github.io/ascii-digits/ when a
# release tag (asciidigits-v<version>) is pushed. To retry a failed deploy,
# re-run that run from the Actions tab. Set up once (see README, "Deploy"):
# Pages source "GitHub Actions", and a tag rule asciidigits-v* on the
# github-pages environment.
on:
  push:
    tags: ["asciidigits-v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # build_site.py republishes every earlier release tag
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - name: Check that the tag names this version
        run: |
          version=$(python -c "import asciidigits; print(asciidigits.__version__)")
          if [ "$GITHUB_REF_NAME" != "asciidigits-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match asciidigits $version"
            exit 1
          fi
      - run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
